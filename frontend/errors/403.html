<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heritage Library | Forbidden</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<link rel="stylesheet" href="/errors/error.css" />
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="/">
        <i class="fas fa-book-open brand-icon"></i>Heritage Library
      </a>
    </div>
  </nav>

  <main class="error-section">
    <div class="error-card">

      <div class="icon-badge badge-default">
        <i class="fas fa-ban"></i>
      </div>

      <span class="error-eyebrow">Access Forbidden</span>
      <h1 class="error-heading">403 — Forbidden</h1>
      <p class="error-body">
        You don't have permission to view this page.
        If you believe this is a mistake, please contact your administrator.
      </p>

      <a href="/" class="btn-primary-dark">
        <i class="fas fa-home" style="margin-right:8px"></i>
        Back to Home
      </a>

      <hr class="error-divider" />

      <a href="javascript:history.back()" class="back-link">
        <i class="fas fa-long-arrow-alt-left"></i>
        Go Back
      </a>

    </div>
  </main>

  <footer class="main-footer">
    <div class="footer-inner">
      <div class="footer-top-row">
        <a class="footer-brand" href="/">
          <i class="fas fa-book-open brand-icon"></i> Heritage Library
        </a>
        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <span class="link-divider"></span>
          <a href="#">Terms of Service</a>
          <span class="link-divider"></span>
          <a href="#">Contact Support</a>
        </div>
      </div>
      <div class="footer-bottom-row">
        <p class="copyright-text">&copy; 2026 Heritage Library. All rights reserved.</p>
      </div>
    </div>
  </footer>

</body>
</html>
