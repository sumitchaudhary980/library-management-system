<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaiser Library | Edit Profile</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/dashboard">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Kaiser Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>

    <div class="dashboard-wrapper">
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/dashboard">
            <i class="fas fa-book-open brand-icon me-2"></i>

            Kaiser Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category"> Core </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/dashboard" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>

                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category"> Management </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book menu-icon"></i>

                Books
              </a>
            </li>

            <li>
              <a href="/authors" class="menu-item">
                <i class="fas fa-pen-nib menu-icon"></i>

                Authors
              </a>
            </li>

            <li>
              <a href="/genres" class="menu-item">
                <i class="fas fa-tags menu-icon"></i>

                Genres
              </a>
            </li>
          </ul>
        </div>

        <div
          class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3"
          style="border-color: rgba(255, 255, 255, 0.05) !important"
        >
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item active">
                <i class="far fa-user menu-icon"></i>

                View Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>

                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Edit Profile
              </h1>

              <p class="text-muted small mb-0">
                Update your personal information
              </p>
            </div>

            <a href="/profile" class="btn text-white author-submit-btn">
              <i class="fas fa-arrow-left me-2"></i>
              Back to Profile
            </a>
          </div>

          <!-- FORM START -->

          <form id="profileForm" novalidate>
            <div class="profile-hero-card mb-4">
              <div class="profile-hero-cover"></div>

              <div class="profile-hero-body">
                <!-- IMAGE -->
                <div class="profile-avatar-wrap text-center">
                  <img
                    id="imagePreview"
                    class="profile-avatar"
                    style="display: none"
                  />
                  <div id="placeholder" class="profile-avatar-placeholder">
                    <i class="fas fa-user"></i>
                  </div>

                  <input
                    type="file"
                    id="profileImage"
                    accept="image/*,.heic"
                    class="form-control mt-3"
                  />

                  <small
                    class="text-danger d-block mt-1"
                    id="imageError"
                  ></small>
                </div>

                <!-- FIELDS -->
                <div class="profile-hero-info w-100">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label>First Name</label>
                      <input type="text" id="first_name" class="form-control" />
                      <small class="text-danger" id="firstNameError"></small>
                    </div>

                    <div class="col-md-6">
                      <label>Last Name</label>
                      <input type="text" id="last_name" class="form-control" />
                      <small class="text-danger" id="lastNameError"></small>
                    </div>

                    <div class="col-md-6">
                      <label>Gender</label>
                      <select id="gender" class="form-control">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                      </select>
                      <small class="text-danger" id="genderError"></small>
                    </div>

                    <div class="col-md-6">
                      <label>Phone</label>
                      <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                      />
                      <small class="text-danger" id="phoneError"></small>
                    </div>

                    <div class="col-md-12">
                      <label>Address</label>
                      <input type="text" id="address" class="form-control" />
                      <small class="text-danger" id="addressError"></small>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="card border-0 shadow-sm profile-card">
              <div class="card-body d-flex justify-content-end gap-2">
                <a href="/profile" class="btn btn-light author-cancel-btn">
                  Cancel
                </a>

                <button type="submit" class="btn author-submit-btn text-white">
                  Save Changes
                </button>
              </div>
            </div>
          </form>
          <!-- FORM END -->
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/assets/js/edit-profile.js"></script>
  </body>
</html>
