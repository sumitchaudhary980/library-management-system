<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaiser Library | Add Genre</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div class="dashboard-wrapper">
      <!-- SAME SIDEBAR AS AUTHOR (UNCHANGED) -->
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/dashboard">
            <i class="fas fa-book-open brand-icon me-2"></i>
            Kaiser Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category"> Core </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/dashboard" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category"> Management </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book menu-icon"></i>
                Books
              </a>
            </li>

            <li>
              <a href="/authors" class="menu-item">
                <i class="fas fa-pen-nib menu-icon"></i>
                Authors
              </a>
            </li>

            <li>
              <a href="/genres" class="menu-item">
                <i class="fas fa-tags menu-icon"></i>
                Genres
              </a>
            </li>
            <li>
              <a href="/readers" class="menu-item">
                <i class="fas fa-user-group menu-icon"></i>
                Readers
              </a>
            </li>
            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3">
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>
                View Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Add Genre
              </h1>

              <p class="text-muted small mb-0">Create a new genre.</p>
            </div>

            <a href="/genres" class="btn text-white author-submit-btn">
              <i class="fas fa-arrow-left me-2"></i>
              Back to Genre
            </a>
          </div>
          <div class="card border-0 shadow-sm bg-white p-4 author-form-card">
            <form id="genreForm" novalidate>
              <div class="mb-4">
                <label class="form-label fw-semibold">
                  Genre Name
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  id="name"
                  class="form-control author-input"
                  placeholder="Enter genre name"
                />

                <div class="invalid-feedback">Genre name is required.</div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn text-white author-submit-btn">
                  Save Genre
                </button>

                <a href="/genres" class="btn btn-light author-cancel-btn">
                  Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/add-genre.js"></script>
  </body>
</html>
