<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png" />
    <title>Heritage Library | Edit Author</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/home">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Heritage Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>
    <div class="dashboard-wrapper">
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a href="/dashboard" class="sidebar-brand font-serif fw-bold">
            <i class="fas fa-book-open brand-icon me-2"></i>

            Heritage Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category"> Core </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/dashboard" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>

                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category"> Management </span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book menu-icon"></i>

                Books
              </a>
            </li>

            <li>
              <a href="/authors" class="menu-item">
                <i class="fas fa-pen-nib menu-icon"></i>

                Authors
              </a>
            </li>

            <li>
              <a href="/genres" class="menu-item">
                <i class="fas fa-tags menu-icon"></i>

                Genres
              </a>
            </li>
            <li>
              <a href="/readers" class="menu-item">
                <i class="fas fa-user-group menu-icon"></i>
                Readers
              </a>
            </li>
            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3">
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>

                View Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>

                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Edit Author
              </h1>

              <p class="text-muted small mb-0">Update author information.</p>
            </div>

            <a href="/authors" class="author-submit-btn app-primary-action-btn app-primary-action-btn">
              <i class="fas fa-arrow-left me-2"></i>
              Back to Authors
            </a>
          </div>

          <div class="card border-0 shadow-sm bg-white p-4 author-form-card">
            <form id="authorForm" novalidate>
              <div class="mb-4">
                <label class="form-label fw-semibold">
                  Author Name

                  <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  id="name"
                  class="form-control author-input"
                  placeholder="Enter author name"
                />

                <div class="invalid-feedback">Author name is required.</div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold"> Biography </label>

                <textarea
                  id="biography"
                  class="form-control author-textarea"
                  placeholder="Enter author biography"
                ></textarea>
              </div>

              <div class="d-flex gap-2">
                <button
                  type="submit"
                  id="submitBtn"
                  class="author-submit-btn app-primary-action-btn app-primary-action-btn"
                  data-text="Save Author"
                  data-loading-text="Updating..."
                  data-loading-spinner="true"
                  data-icon='<i class="fas fa-user-plus ms-2"></i>'
                >
                  <span id="btnText">Update Author</span>
                  <span id="btnIcon">
                    <i class="fas fa-pen ms-2"></i>
                  </span>
                </button>

                <a href="/authors" class="btn btn-light author-cancel-btn">
                  Cancel
                </a>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/auth/auth.js"></script>
    <script src="/assets/js/button-loading.js"></script>
    <script src="/assets/js/edit-author.js"></script>
  </body>
</html>
