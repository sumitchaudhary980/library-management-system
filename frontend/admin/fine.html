<!doctype html>
<html lang="en">
  <head>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Library | Fines & Penalties</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/dashboard">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Heritage Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>

    <div class="dashboard-wrapper">
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/dashboard">
            <i class="fas fa-book-open brand-icon me-2"></i>
            Heritage Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category">Core</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/dashboard" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category">Management</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book menu-icon"></i>
                Books
              </a>
            </li>

            <li>
              <a href="/authors" class="menu-item">
                <i class="fas fa-pen-nib menu-icon"></i>
                Authors
              </a>
            </li>

            <li>
              <a href="/genres" class="menu-item">
                <i class="fas fa-tags menu-icon"></i>
                Genres
              </a>
            </li>
            <li>
              <a href="/readers" class="menu-item">
                <i class="fas fa-user-group menu-icon"></i>
                Readers
              </a>
            </li>
            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div
          class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3"
          style="border-color: rgba(255, 255, 255, 0.05) !important"
        >
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>
                View Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Outstanding Fines
              </h1>

              <p class="text-muted mb-0 small">
                View users with outstanding fines and manage payments.
              </p>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm bg-white p-4 mb-4"
            style="border-radius: 16px"
          >
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold text-primary-dark mb-0">
                <i
                  class="fas fa-filter me-2"
                  style="color: var(--primary-dark)"
                ></i>
                Filters
              </h6>

              <button
                id="clearFilters"
                type="button"
                class="btn btn-sm text-muted"
                style="border: 1px solid #e2e8f0; border-radius: 8px"
              >
                <i class="fas fa-rotate-left me-1"></i>
                Clear
              </button>
            </div>

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label small fw-medium text-muted mb-1">
                  User
                </label>

                <input
                  id="searchUser"
                  type="text"
                  class="form-control shadow-sm"
                  placeholder="Search by name or email..."
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-medium text-muted mb-1">
                  Fine Status
                </label>

                <select
                  id="fineStatus"
                  class="form-select shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                >
                  <option value="">All</option>
                  <option value="unpaid">Has Outstanding Fine</option>
                  <option value="paid">No Outstanding Fine</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-medium text-muted mb-1">
                  Sort By
                </label>

                <select
                  id="sortBy"
                  class="form-select shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                >
                  <option value="highest">Highest Fine</option>
                  <option value="lowest">Lowest Fine</option>
                  <option value="name">Name (A-Z)</option>
                </select>
              </div>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm bg-white"
            style="border-radius: 16px; overflow: hidden"
          >
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead
                  style="background: #f8fafc; border-bottom: 2px solid #e2e8f0"
                >
                  <tr>
                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4"
                    >
                      Member
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-center"
                    >
                      Fined Books
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-center"
                    >
                      Unpaid Books
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-center"
                    >
                      Outstanding Fine
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-center"
                    >
                      Action
                    </th>
                  </tr>
                </thead>

                <tbody id="fineTable"></tbody>

              </table>
            </div>
          </div>

          <div
            class="d-flex justify-content-between align-items-center mt-4 flex-wrap"
          >
            <span id="entryText" class="text-muted small mb-2 mb-md-0"></span>

            <nav>
              <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
            </nav>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/auth/auth.js"></script>
    <script src="/assets/js/fine.js"></script>
  </body>
</html>
