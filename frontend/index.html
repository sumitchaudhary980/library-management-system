<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaiser Library | Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <nav class="navbar fixed-top bg-white shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand font-serif fw-bold" href="#">
                <i class="fas fa-book-open brand-icon me-2"></i>
                Kaiser Library
            </a>
        </div>
    </nav>

    <main class="hero-section">
        <div class="container">
            <div class="row align-items-center gy-5 flex-column-reverse flex-lg-row">
                <div class="col-lg-6 text-center text-lg-start pe-lg-5">
                    <span class="text-uppercase fw-bold mb-3 d-block hero-subtitle">Welcome to the digital portal</span>
                    <h1 class="display-4 font-serif fw-bold mb-4 line-height-tight text-primary-dark">
                        Empowering your pursuit of knowledge.
                    </h1>
                    <p class="lead mb-5 text-muted-custom">
                        Access a world of literature, academic resources, and community archives. Please select your role below to enter the management system.
                    </p>
                    <div class="action-buttons">
                        <a href="admin/login.html" class="btn-portal btn-admin">
                            <i class="fas fa-user-shield me-2"></i> Admin Portal
                        </a>
                        <a href="#" class="btn-portal btn-user">
                            <i class="fas fa-book-reader me-2"></i> User Portal
                        </a>
                    </div>
                </div>
                
                <div class="col-lg-6 ps-lg-5">
                    <div class="hero-image-wrapper">
                        <div class="bg-blob"></div>
                        <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Interior of Kaiser Library" class="hero-image img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
