<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <title>Heritage Library | View Book</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/dashboard">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Heritage Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>

    <div class="dashboard-wrapper">
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/user/dashboard">
            <i class="fas fa-book-open brand-icon me-2"></i>
            Heritage Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category">Core</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/user/dashboard" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category">Library</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book-open menu-icon"></i>
                Browse Books
              </a>
            </li>

            <li>
              <a href="/borrowed-books" class="menu-item">
                <i class="fas fa-book-reader menu-icon"></i>
                Borrowed Books
              </a>
            </li>

            <li>
              <a href="/borrow-history" class="menu-item">
                <i class="fas fa-clock-rotate-left menu-icon"></i>
                Borrow History
              </a>
            </li>

            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div
          class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3"
          style="border-color: rgba(255, 255, 255, 0.05) !important"
        >
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>
                My Profile
              </a>
            </li>

            <li>
              <button class="menu-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt menu-icon"></i>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Book Details
              </h1>

              <p class="text-muted mb-0 small">
                View complete information about this book.
              </p>
            </div>

            <div class="d-flex gap-2">
              <a
                href="/books"
                class="author-submit-btn app-primary-action-btn app-primary-action-btn text-nowrap"
              >
                <i class="fas fa-arrow-left me-2"></i>
                Back to Books
              </a>

              <button
                id="borrowBookButton"
                type="button"
                class="author-submit-btn app-primary-action-btn text-nowrap"
              >
                <i class="fas fa-book-reader me-2"></i>
                Borrow Book
              </button>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm overflow-hidden"
            style="border-radius: 18px"
          >
            <div class="row g-0 align-items-start">
              <div class="col-lg-4 p-5" style="background: #f8fafc">
                <div class="position-sticky" style="top: 20px">
                  <img
                    id="coverImage"
                    src=""
                    alt="Book Cover"
                    class="img-fluid shadow d-block mx-auto"
                    style="
                      width: 270px;
                      max-width: 100%;
                      height: 380px;
                      border-radius: 14px;
                      object-fit: cover;
                    "
                  />
                </div>
              </div>

              <div class="col-lg-8">
                <div class="p-4 p-lg-5">
                  <!-- Title + Badges -->
                  <div>
                    <h2
                      id="bookTitle"
                      class="font-serif fw-bold text-primary-dark mb-2"
                    ></h2>

                    <div class="d-flex flex-wrap gap-2 mt-3">
                      <span
                        id="bookGenreBadge"
                        class="badge px-3 py-2"
                        style="
                          background: #eef4ff;
                          color: #002147;
                          border-radius: 30px;
                          font-size: 0.9rem;
                        "
                      ></span>

                      <span id="bookStockBadge"></span>
                    </div>
                  </div>

                  <hr class="my-4" />

                  <!-- Details -->
                  <div class="row g-4">
                    <!-- Author -->
                    <div class="col-md-6">
                      <div
                        class="border rounded-4 p-4 h-100"
                        style="background: #fff"
                      >
                        <small class="text-muted text-uppercase fw-semibold">
                          Author
                        </small>

                        <h5
                          id="bookAuthor"
                          class="mt-2 mb-0 fw-bold text-primary-dark"
                        ></h5>
                      </div>
                    </div>

                    <!-- Available Copies -->
                    <div class="col-md-6">
                      <div
                        class="border rounded-4 p-4 h-100"
                        style="background: #fff"
                      >
                        <small class="text-muted text-uppercase fw-semibold">
                          Available Copies
                        </small>

                        <h4
                          id="bookStock"
                          class="mt-2 mb-0 fw-bold text-success"
                        ></h4>
                      </div>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                      <div
                        class="border rounded-4 p-4"
                        style="background: #fff"
                      >
                        <div class="d-flex align-items-center mb-3">
                          <i
                            class="fas fa-align-left me-2"
                            style="color: #002147"
                          ></i>

                          <h5 class="mb-0 fw-bold text-primary-dark">
                            Description
                          </h5>
                        </div>

                        <p
                          id="bookDescription"
                          class="text-muted mb-0"
                          style="
                            line-height: 1.9;
                            text-align: justify;
                            font-size: 0.97rem;
                          "
                        ></p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

   <script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
  crossorigin="anonymous"
  defer
></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/assets/js/auth/auth.js"></script>
    <script src="/assets/js/user/view-book.js"></script>
  </body>
</html>
