<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaiser Library | Edit Profile</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/home">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Kaiser Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>

    <div class="dashboard-wrapper">
      <!-- Sidebar -->
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/home">
            <i class="fas fa-book-open brand-icon me-2"></i>
            Kaiser Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category">Core</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/home" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category">Library</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book-open menu-icon"></i>
                Browse Books
              </a>
            </li>

            <li>
              <a href="/borrowed-books" class="menu-item">
                <i class="fas fa-book-reader menu-icon"></i>
                Borrowed Books
              </a>
            </li>

            <li>
              <a href="/borrow-history" class="menu-item">
                <i class="fas fa-clock-rotate-left menu-icon"></i>
                Borrow History
              </a>
            </li>

            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div
          class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3"
          style="border-color: rgba(255, 255, 255, 0.05) !important"
        >
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>
                My Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Edit Profile
              </h1>

              <p class="text-muted small mb-0">
                Update your personal information
              </p>
            </div>

            <a href="/profile" class="btn text-white author-submit-btn">
              <i class="fas fa-arrow-left me-2"></i>
              Back to Profile
            </a>
          </div>

          <!-- FORM START -->

          <form id="profileForm" novalidate>
            <div class="profile-hero-card mb-4">
              <div class="profile-hero-cover"></div>

              <div class="profile-hero-body align-items-start">
                <!-- PROFILE IMAGE -->
                <div class="profile-avatar-wrap text-center">
                  <img
                    id="imagePreview"
                    class="profile-avatar"
                    style="display: none"
                  />

                  <div id="placeholder" class="profile-avatar-placeholder">
                    <i class="fas fa-user"></i>
                  </div>

                  <input
                    type="file"
                    id="profileImage"
                    class="form-control author-input mt-3"
                    accept="image/*,.heic"
                  />

                  <div
                    class="invalid-feedback"
                    data-default="Please select a valid image."
                  ></div>
                </div>

                <!-- PROFILE FIELDS -->
                <div class="profile-hero-info w-100">
                  <div class="row">
                    <!-- First Name -->
                    <div class="col-md-6 mb-4">
                      <label class="form-label fw-semibold">
                        First Name <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="first_name"
                        class="form-control author-input"
                        placeholder="Enter first name"
                      />

                      <div
                        class="invalid-feedback"
                        data-default="First name is required."
                      ></div>
                    </div>

                    <!-- Last Name -->
                    <div class="col-md-6 mb-4">
                      <label class="form-label fw-semibold">
                        Last Name <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="last_name"
                        class="form-control author-input"
                        placeholder="Enter last name"
                      />

                      <div
                        class="invalid-feedback"
                        data-default="Last name is required."
                      ></div>
                    </div>

                    <!-- Gender -->
                    <div class="col-md-6 mb-4">
                      <label class="form-label fw-semibold">
                        Gender <span class="text-danger">*</span>
                      </label>

                      <select id="gender" class="form-select author-input">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                      </select>

                      <div
                        class="invalid-feedback"
                        data-default="Gender is required."
                      ></div>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6 mb-4">
                      <label class="form-label fw-semibold">
                        Phone Number <span class="text-danger">*</span>
                      </label>

                      <input
                        type="tel"
                        id="phone"
                        class="form-control author-input"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                      />

                      <div
                        class="invalid-feedback"
                        data-default="Phone number is required."
                      ></div>
                    </div>

                    <!-- Address -->
                    <div class="col-12 mb-4">
                      <label class="form-label fw-semibold">
                        Address <span class="text-danger">*</span>
                      </label>

                      <input
                        type="text"
                        id="address"
                        class="form-control author-input"
                        placeholder="Enter address"
                      />

                      <div
                        class="invalid-feedback"
                        data-default="Address is required."
                      ></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- BUTTONS -->
            <div class="card border-0 shadow-sm profile-card">
              <div class="card-body d-flex justify-content-end gap-2">
                <a href="/profile" class="btn btn-light author-cancel-btn">
                  Cancel
                </a>

                <button type="submit" class="btn author-submit-btn text-white">
                  Save Changes
                </button>
              </div>
            </div>
          </form>
          <!-- FORM END -->
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/user/edit-profile.js"></script>
  </body>
</html>
