<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Library | Borrow History</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body class="dashboard-body">
    <!-- Mobile Header -->
    <div
      class="mobile-header d-lg-none bg-white border-bottom px-3 py-2 d-flex align-items-center justify-content-between fixed-top"
    >
      <a class="navbar-brand font-serif fw-bold m-0 fs-4" href="/home">
        <i class="fas fa-book-open brand-icon me-2"></i>
        Heritage Library
      </a>

      <button
        class="btn btn-outline-dark border-0 p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#sidebarCollapse"
      >
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>

    <div class="dashboard-wrapper">
      <!-- Sidebar -->
      <aside class="admin-sidebar collapse d-lg-flex" id="sidebarCollapse">
        <div class="sidebar-header d-none d-lg-flex">
          <a class="sidebar-brand font-serif fw-bold" href="/home">
            <i class="fas fa-book-open brand-icon me-2"></i>
            Heritage Library
          </a>
        </div>

        <div class="sidebar-menu-wrapper">
          <span class="menu-category">Core</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/home" class="menu-item">
                <i class="fas fa-chart-pie menu-icon"></i>
                Dashboard
              </a>
            </li>
          </ul>

          <span class="menu-category">Library</span>

          <ul class="sidebar-menu">
            <li>
              <a href="/books" class="menu-item">
                <i class="fas fa-book-open menu-icon"></i>
                Browse Books
              </a>
            </li>

            <li>
              <a href="/borrowed-books" class="menu-item">
                <i class="fas fa-book-reader menu-icon"></i>
                Borrowed Books
              </a>
            </li>

            <li>
              <a href="/borrow-history" class="menu-item">
                <i class="fas fa-clock-rotate-left menu-icon"></i>
                Borrow History
              </a>
            </li>

            <li>
              <a href="/fines" class="menu-item">
                <i class="fas fa-money-check-dollar menu-icon"></i>
                Fines & Penalties
              </a>
            </li>
          </ul>
        </div>

        <div
          class="sidebar-footer-nav mt-auto border-top pt-3 px-2 pb-3"
          style="border-color: rgba(255, 255, 255, 0.05) !important"
        >
          <ul class="sidebar-menu mb-0">
            <li>
              <a href="/profile" class="menu-item">
                <i class="far fa-user menu-icon"></i>
                My Profile
              </a>
            </li>

            <li>
              <button onclick="logout()" class="menu-item">
                <i class="fas fa-sign-out-alt menu-icon"></i>
                Logout
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="dashboard-content">
        <div class="container-fluid p-0">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h1 class="font-serif fw-bold h3 text-primary-dark mb-1">
                Borrow History
              </h1>

              <p class="text-muted mb-0 small">
                View all books you have previously borrowed and returned.
              </p>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm bg-white p-4 mb-4"
            style="border-radius: 16px"
          >
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-bold text-primary-dark mb-0">
                <i
                  class="fas fa-filter me-2"
                  style="color: var(--primary-dark)"
                ></i>
                Filters
              </h6>

              <button
                id="clearFilters"
                type="button"
                class="btn btn-sm text-muted"
                style="border: 1px solid #e2e8f0; border-radius: 8px"
              >
                <i class="fas fa-rotate-left me-1"></i>
                Clear
              </button>
            </div>

            <div class="row g-3">
              <!-- Title -->
              <div class="col-lg-4 col-md-6">
                <label
                  for="searchBook"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Title
                </label>

                <input
                  id="searchBook"
                  type="text"
                  class="form-control shadow-sm"
                  placeholder="Search book title..."
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <!-- Borrowed From -->
              <div class="col-lg-2 col-md-6">
                <label
                  for="borrowedFrom"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Borrowed From
                </label>

                <input
                  id="borrowedFrom"
                  type="date"
                  class="form-control shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <!-- Borrowed To -->
              <div class="col-lg-2 col-md-6">
                <label
                  for="borrowedTo"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Borrowed To
                </label>

                <input
                  id="borrowedTo"
                  type="date"
                  class="form-control shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <!-- Returned From -->
              <div class="col-lg-2 col-md-6">
                <label
                  for="returnedFrom"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Returned From
                </label>

                <input
                  id="returnedFrom"
                  type="date"
                  class="form-control shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <!-- Returned To -->
              <div class="col-lg-2 col-md-6">
                <label
                  for="returnedTo"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Returned To
                </label>

                <input
                  id="returnedTo"
                  type="date"
                  class="form-control shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                />
              </div>

              <!-- Sort -->
              <div class="col-lg-3 col-md-6">
                <label
                  for="sortBy"
                  class="form-label small fw-medium text-muted mb-1"
                >
                  Sort By
                </label>

                <select
                  id="sortBy"
                  class="form-select shadow-sm"
                  style="
                    height: 44px;
                    border-radius: 8px;
                    border-color: #e2e8f0;
                  "
                >
                  <option value="returned_desc">Recently Returned</option>
                  <option value="returned_asc">Oldest Returned</option>
                  <option value="borrowed_desc">Recently Borrowed</option>
                  <option value="borrowed_asc">Oldest Borrowed</option>
                </select>
              </div>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm bg-white"
            style="border-radius: 16px; overflow: hidden"
          >
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead
                  style="background: #f8fafc; border-bottom: 2px solid #e2e8f0"
                >
                  <tr>
                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Cover
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Book
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Author
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Borrowed On
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Due Date
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-nowrap"
                    >
                      Returned On
                    </th>

                    <th
                      class="text-uppercase text-muted small fw-bold py-3 px-4 text-center text-nowrap"
                    >
                      Status
                    </th>
                  </tr>
                </thead>

                <tbody id="borrowHistoryTable"></tbody>
              </table>
            </div>
          </div>

          <div
            class="d-flex justify-content-between align-items-center mt-4 flex-wrap"
          >
            <span id="entryText" class="text-muted small mb-2 mb-md-0"></span>

            <nav>
              <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
            </nav>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/assets/js/auth/auth.js"></script>
    <script src="/assets/js/user/borrow-history.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
