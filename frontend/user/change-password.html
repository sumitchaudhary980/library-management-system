<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kaiser Library | Change Password</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body>
    <nav class="navbar fixed-top bg-white shadow-sm">
      <div class="container py-2">
        <a class="navbar-brand font-serif fw-bold" href="/">
          <i class="fas fa-book-open brand-icon me-2"></i>
          Kaiser Library
        </a>
      </div>
    </nav>

    <main class="login-section">
      <div class="container d-flex justify-content-center align-items-center">
        <div class="login-container">
          <div class="login-card">
            <div class="text-center mb-4">
              <div class="icon-badge mb-3">
                <i class="fas fa-user-lock text-white fa-lg"></i>
              </div>

              <span class="text-uppercase fw-bold login-subtitle d-block mb-1">
                Library Management Portal
              </span>

              <h2 class="font-serif fw-bold text-primary-dark">
                Change Password
              </h2>

              <p class="text-muted small">
                Please change your temporary password before continuing.
              </p>
            </div>

            <form id="changePasswordForm">
              <!-- NEW PASSWORD -->

              <div class="mb-4">
                <label class="form-label fw-medium">
                  New Password
                  <span class="text-danger">*</span>
                </label>

                <div class="input-group-custom">
                  <span class="input-icon">
                    <i class="fas fa-lock"></i>
                  </span>

                  <input
                    id="newPassword"
                    type="password"
                    class="form-control input-field input-password-field"
                    placeholder="Enter new password"
                    style="padding-right: 44px !important"
                  />

                  <span
                    class="password-toggle-wrapper"
                    style="right: 16px !important"
                  >
                    <i
                      class="far fa-eye text-muted"
                      style="cursor: pointer"
                      onclick="togglePassword('newPassword', this)"
                    ></i>
                  </span>
                </div>

                <div
                  class="invalid-feedback"
                  data-default="Password is required"
                ></div>
              </div>

              <!-- CONFIRM PASSWORD -->

              <div class="mb-4">
                <label class="form-label fw-medium">
                  Confirm Password
                  <span class="text-danger">*</span>
                </label>

                <div class="input-group-custom">
                  <span class="input-icon">
                    <i class="fas fa-lock"></i>
                  </span>

                  <input
                    id="confirmPassword"
                    type="password"
                    class="form-control input-field input-password-field"
                    placeholder="Confirm new password"
                    style="padding-right: 44px !important"
                  />

                  <span
                    class="password-toggle-wrapper"
                    style="right: 16px !important"
                  >
                    <i
                      class="far fa-eye text-muted"
                      style="cursor: pointer"
                      onclick="togglePassword('confirmPassword', this)"
                    ></i>
                  </span>
                </div>

                <div
                  class="invalid-feedback"
                  data-default="Passwords must match"
                ></div>
              </div>

              <div class="alert alert-info border-0">
                <i class="fas fa-shield-halved me-2"></i>

                Your temporary password will be replaced with your new password.
              </div>

              <button type="submit" class="btn-login mb-3">
                Update Password

                <i class="fas fa-arrow-right ms-2"></i>
              </button>

              <div class="text-center">
                <a href="/" class="back-link text-decoration-none">
                  <i class="fas fa-long-arrow-alt-left me-2"></i>

                  Back to Home
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/assets/js/auth.js"></script>

    <script src="/assets/js/user/change-password.js"></script>
  </body>
</html>
